
{% extends "base.html" %}

{% block title %}Dashboard | LaborConnect{% endblock %}

{% block content %}

<div class="auth-page">
    <div class="auth-card">

        <h2>Welcome, {{ session.full_name }}!</h2>

        <p class="auth-subtitle">
            You are logged in as {{ session.role }}.
        </p>

        <a href="{{ url_for('logout') }}" class="auth-submit">
            Logout
        </a>

    </div>
</div>

{% endblock %}
